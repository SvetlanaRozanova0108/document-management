server:
  port: 8080

spring:
  application:
    name: document-management

  datasource:
    url: jdbc:postgresql://localhost:5432/documentdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/changelog-master.xml
    enabled: true

app:
  batch:
    size: 100

  worker:
    submit:
      enabled: true
      fixed-delay: 60000  # 1 минута в миллисекундах
      initial-delay: 10000 # 10 секунд
    approve:
      enabled: true
      fixed-delay: 60000  # 1 минута
      initial-delay: 30000 # 30 секунд

logging:
  level:
    ru.practicum.web.worker: DEBUG
    org.springframework: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"